services:
  - type: worker
    name: quant-intelligence-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.main
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: MARKET_DATA_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: FUNDAMENTAL_API_KEY
        sync: false
      - key: MACRO_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: ADMIN_USER_IDS
        sync: false
