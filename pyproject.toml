[project]
name = "quant-investment-intelligence-platform"
version = "0.1.0"
description = "Professional Quant Investment Intelligence Platform with Telegram interface"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot[job-queue]>=22,<23",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.30,<1",
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "yfinance>=0.2.54,<1",
  "feedparser>=6.0,<7",
  "httpx>=0.28,<1",
  "matplotlib>=3.10,<4",
  "mplfinance>=0.12.10b0,<1",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "alembic>=1.15,<2",
  "redis>=5.2,<6",
  "APScheduler>=3.11,<4",
  "tenacity>=9.0,<10",
]

[project.optional-dependencies]
ml = [
  "xgboost>=2.1,<4",
  "lightgbm>=4.5,<5",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "mypy>=1.15,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
